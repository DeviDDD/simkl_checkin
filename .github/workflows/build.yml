name: Build and release

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1" # every Monday: release anything merged since the last release
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: current

      # Pull requests: prove the change compiles. Nothing is merged unless this passes.
      - name: Test build
        if: github.event_name == 'pull_request'
        run: gradle assembleDebug

      - name: Merge dependency update
        if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
        run: gh pr merge --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ github.token }}

      # For getting pull request merging error information.
      - name: Tell me when an update fails
        if: failure() && github.event_name == 'pull_request'
        run: gh pr comment "$PR_URL" --body "@${{ github.repository_owner }} this update failed to build, so was not merged. Open the CHecks tab to see the error."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ github.token }}

      # Main branch: skip the weekly run when the latest commit is already released.
      - name: Decide whether to release
        id: gate
        if: github.event_name != 'pull_request'
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ -n "$(git tag --points-at HEAD)" ]; then
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build signed APK
        if: steps.gate.outputs.go == 'true'
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Add the KEYSTORE_BASE64 and KEYSTORE_PASSWORD repository secrets (see README)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          export KEYSTORE_FILE="$RUNNER_TEMP/release.p12"
          gradle assembleRelease
          cp app/build/outputs/apk/release/app-release.apk simkl-checkin.apk

      - name: Publish release
        if: steps.gate.outputs.go == 'true'
        run: |
          gh release create "v${{ github.run_number }}" simkl-checkin.apk \
            --target "$GITHUB_SHA" \
            --title "Build ${{ github.run_number }}" \
            --notes "Automated build."
        env:
          GH_TOKEN: ${{ github.token }}
